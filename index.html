<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snack Pack Flightz | Pay</title>
  <style>
    :root{
      --bg:#050509;
      --panel:#111119;
      --text:#fff;
      --muted:#aaaabd;
      --green:#39ff14;
      --purple:#9b5cff;
      --pink:#ff3dbb;
      --blue:#28c7ff;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at top, rgba(40,199,255,.16), transparent 35%),
        #050509;
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 16px;
    }

    .wrap{
      width:100%;
      max-width:620px;
    }

    .brand{
      text-align:center;
      margin-bottom:18px;
    }

    .brand h1{
      margin:0;
      font-size:34px;
      text-transform:uppercase;
      letter-spacing:-1px;
    }

    .brand p{
      margin:7px 0 0;
      color:var(--green);
      font-size:13px;
      font-weight:800;
      letter-spacing:1px;
    }

    .pay{
      display:block;
      text-decoration:none;
      color:white;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.12);
      position:relative;
      transition:.18s ease;
    }

    .pay:hover{
      transform:translateY(-2px);
    }

    .square{
      padding:34px 26px;
      min-height:230px;
      background:
        linear-gradient(135deg, rgba(40,199,255,.24), rgba(57,255,20,.08)),
        var(--panel);
      box-shadow:0 24px 70px rgba(0,0,0,.45);
    }

    .stripe{
      padding:20px 22px;
      margin-top:14px;
      background:
        linear-gradient(135deg, rgba(155,92,255,.16), rgba(255,61,187,.07)),
        var(--panel);
    }

    .preferred{
      display:inline-block;
      background:var(--green);
      color:#050509;
      font-size:11px;
      font-weight:900;
      padding:7px 10px;
      border-radius:999px;
      margin-bottom:18px;
      text-transform:uppercase;
      letter-spacing:.8px;
    }

    .square strong{
      display:block;
      font-size:32px;
      margin-bottom:12px;
    }

    .stripe strong{
      display:block;
      font-size:20px;
    }

    .methods{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:18px;
    }

    .pill{
      padding:8px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
    }

    .arrow{
      position:absolute;
      right:22px;
      top:22px;
      font-size:28px;
    }

    .footer{
      text-align:center;
      margin-top:16px;
      font-size:11px;
      color:#777789;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <h1>Snack Pack Flightz</h1>
      <p>PAYMENT TERMINAL</p>
    </div>

    <a class="pay square"
       href="https://square.link/u/LJ2wy4qv"
       target="_blank"
       rel="noopener">
      <span class="arrow">→</span>
      <span class="preferred">Preferred</span>
      <strong>Pay With Square</strong>
    </a>

    <a class="pay stripe"
       href="https://buy.stripe.com/bJe7sK88EbN22yh10O4gg0o"
       target="_blank"
       rel="noopener">
      <span class="arrow">→</span>
      <strong>Other Payment Options</strong>

      <div class="methods">
        <span class="pill">Klarna</span>
        <span class="pill">Afterpay</span>
        <span class="pill">Link Pay</span>
        <span class="pill">Zip Pay</span>
      </div>
    </a>

    <div class="footer">
      YOUR NEW LOCAL DISPENSARY. FIRE YOUR OLD PLUG.
    </div>
  </main>
</body>
</html>
